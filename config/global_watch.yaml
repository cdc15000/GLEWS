# GLEWS Multi-Site Operational Watch Configuration
#
# Defines known unstable-glacier / rock-slope sites to monitor
# continuously via `glews monitor --config config/global_watch.yaml`.
#
# ~45 sites worldwide including the HKH priority watchlist
# (see config/hkh_priority.yaml for HKH-only monitoring).
#
# Shared sections (acquire/process/detect/cascade/report/monitor) are
# merged into each entry under `sites:`; a per-site section of the same
# name overrides individual keys (shallow merge — e.g. a site can set
# its own `detect.acceleration.sigma_threshold` without repeating the
# rest of the `detect` block).

# ---------------------------------------------------------------------
# Shared defaults, applied to every site below unless overridden
# ---------------------------------------------------------------------

acquire:
  platform: NISAR
  product_types: ["GUNW", "GOFF"]
  path_number: null
  max_scenes: 200
  n_workers: 4
  # Per-site product dirs are set individually below (gunw_dir/goff_dir)
  # so sites don't clobber each other's downloads.

detect:
  seasonal_model: "harmonic"
  n_harmonics: 2
  acceleration:
    window_size_days: 60
    step_days: 12
    changepoint:
      model: "rbf"
      penalty: "bic"
      min_segment_size: 3
    sigma_threshold: 2.5
  # BOCPD changepoint detection (opt-in — uncomment to enable)
  # changepoint:
  #   method: "bocpd"
  #   hazard_rate: 0.01
  #   threshold: 0.25
  #   prior_variance: null
  #   min_displacement_range_m: 0.01
  step_change:
    sigma_threshold: 5.0
    min_displacement_m: 0.5
  clustering:
    min_cluster_pixels: 5
    max_distance_m: 200
    min_area_m2: 10000
  voight:
    enabled: true
    min_points: 5
    r_squared_threshold: 0.7

cascade:
  min_volume_m3: 100000
  exposure:
    max_runout_km: 50
    angle_of_reach_deg: 11
    population_source: "worldpop"
  valley_width_threshold_m: 500

report:
  output_dir: "output"
  formats: ["html", "geojson"]
  include_time_series_plots: true
  include_spatial_maps: true
  include_cascade_scenarios: true

monitor:
  # How often ASF is re-searched (also the CLI --interval default)
  interval_hours: 6
  # Rolling search window — NISAR products can be published days after
  # acquisition, so this must be wider than the check interval.
  lookback_days: 30
  state_dir: "data/monitor_state"
  alert_dir: "output/alerts"
  # Alert level thresholds, as multiples of detect.acceleration.sigma_threshold
  alert_levels:
    INFO: 1.0
    WARNING: 1.5
    CRITICAL: 2.5

# =====================================================================
# Sites
# =====================================================================

