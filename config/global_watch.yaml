  # ===================================================================

  # Kolka Glacier — catastrophic detachment on 20 Sep 2002 killed ~125
  # people in Karmadon gorge.
  - site:
      name: "Kolka Glacier, North Ossetia"
      event_date: "2002-09-20"
      description: >
        Site of the catastrophic 2002 glacier detachment in the Genaldon
        valley, Caucasus. ~100 million m3 of ice and rock traveled 18 km
        in minutes, killing ~125 people. Post-event glacier is rebuilding;
        monitored for renewed instability.
      latitude: 42.75
      longitude: 44.55
      elevation_m: 3200
      hazard_type: "glacier detachment"
      priority: "CRITICAL"
      notes: "2002 catastrophe; glacier rebuilding; heightened sensitivity"
      buffer_km: 15
    acquire:
      gunw_dir: "data/nisar/kolka/gunw"
      goff_dir: "data/nisar/kolka/goff"
    detect:
      acceleration:
        sigma_threshold: 2.0  # heightened sensitivity — catastrophic precedent

  # ===================================================================
  # European Alps
  # ===================================================================

  - site:
      name: "Grandes Jorasses, Mont Blanc Massif"
      event_date: null
      description: >
        Hanging glacier (Whymper serac) on the south face of Grandes
        Jorasses, Mont Blanc massif. Under continuous monitoring by
        Fondazione Montagna Sicura since 2014. Periodic ice avalanches
        of 10,000-50,000 m3 threaten the Val Ferret below.
      latitude: 45.87
      longitude: 6.98
      elevation_m: 4200
      hazard_type: "ice avalanche"
      priority: "HIGH"
      notes: "Formally monitored serac; Val Ferret road and infrastructure at risk"
      buffer_km: 8
    acquire:
      gunw_dir: "data/nisar/grandes_jorasses/gunw"
      goff_dir: "data/nisar/grandes_jorasses/goff"
    detect:
      clustering:
        min_cluster_pixels: 3   # small hanging glacier target
        min_area_m2: 5000
    cascade:
      min_volume_m3: 50000
      exposure:
        max_runout_km: 8
        angle_of_reach_deg: 14  # steep ice avalanche geometry

  - site:
      name: "Aletsch Glacier, Valais, Switzerland"
      event_date: null
      description: >
        Largest glacier in the European Alps (~80 km2). Monitored for
        long-term retreat dynamics, lateral moraine instability (the
        Moosfluh rock slope above the glacier tongue is accelerating),
        and proglacial lake formation risk. UNESCO World Heritage Site.
      latitude: 46.45
      longitude: 8.05
      elevation_m: 1800
      hazard_type: "moraine instability / proglacial lake"
      priority: "MODERATE"
      notes: "Moosfluh rock slope accelerating; UNESCO World Heritage Site"
      buffer_km: 20
    acquire:
      gunw_dir: "data/nisar/aletsch/gunw"
      goff_dir: "data/nisar/aletsch/goff"

  # ===================================================================
  # Iceland
  # ===================================================================

  - site:
      name: "Katla / Myrdalsjokull, Iceland"
      event_date: null
      description: >
        Katla volcano beneath Myrdalsjokull ice cap. Subglacial eruptions
        produce catastrophic jokulhlaups. Last major eruption 1918.
        Overdue based on historical recurrence interval (~50-80 yr).
      latitude: 63.63
      longitude: -19.05
      elevation_m: 1512
      hazard_type: "jokulhlaup / subglacial eruption"
      priority: "HIGH"
      notes: "Overdue eruption; jokulhlaup would reach coast in hours"
      buffer_km: 25
    acquire:
      gunw_dir: "data/nisar/katla/gunw"
      goff_dir: "data/nisar/katla/goff"

  # ===================================================================
  # Greenland
  # ===================================================================

  - site:
      name: "Sermeq Kujalleq (Jakobshavn), Greenland"
      event_date: null
      description: >
        One of the fastest-flowing and most productive tidewater glaciers
        on Earth (~45 km3/yr ice discharge). Calving front retreat has
        accelerated since 2000. Large calving events generate tsunamigenic
        waves in Ilulissat Icefjord.
      latitude: 69.17
      longitude: -49.83
      elevation_m: 0
      hazard_type: "calving / tsunami"
      priority: "HIGH"
      notes: "Key sea-level-rise contributor; tsunamigenic calving events"
      buffer_km: 30
    acquire:
      gunw_dir: "data/nisar/jakobshavn/gunw"
      goff_dir: "data/nisar/jakobshavn/goff"
    detect:
      acceleration:
        window_size_days: 90   # slower dynamics, longer baseline needed
        sigma_threshold: 3.0   # large natural variability in flow speed

  # ===================================================================
  # Antarctica
  # ===================================================================

  - site:
      name: "Thwaites Glacier, West Antarctica"
      event_date: null
      description: >
        Marine-based glacier in West Antarctica, often called the
        "Doomsday Glacier." Grounding line retreating into a retrograde
        bed, raising concerns of irreversible marine ice sheet instability
        (MISI). Complete collapse could contribute ~65 cm of global sea
        level rise.
      latitude: -75.50
      longitude: -106.75
      elevation_m: 0
      hazard_type: "marine ice sheet instability"
      priority: "CRITICAL"
      notes: "ITGC monitoring; retrograde bed geometry; ~65 cm SLR potential"
      buffer_km: 50
    acquire:
      gunw_dir: "data/nisar/thwaites/gunw"
      goff_dir: "data/nisar/thwaites/goff"
    detect:
      acceleration:
        window_size_days: 120  # ice-sheet-scale dynamics, long baseline
        step_days: 24
        sigma_threshold: 3.0
      clustering:
        min_cluster_pixels: 10  # large-scale features expected
        max_distance_m: 500
        min_area_m2: 50000

  # ===================================================================
  # North America
  # ===================================================================

  - site:
      name: "Mount Meager, British Columbia"
      event_date: "2010-08-06"
      description: >
        Volcanic complex in the Garibaldi Volcanic Belt, BC. Site of
        Canada's largest historical landslide (6 Aug 2010, ~53 Mm3)
        which traveled 12 km down Meager Creek. Persistent slope
        instability from hydrothermal alteration and glacier retreat.
      latitude: 50.63
      longitude: -123.50
      elevation_m: 2645
      hazard_type: "rock-ice avalanche / debris flow"
      priority: "HIGH"
      notes: "2010 landslide; hydrothermally altered volcanic rock; multiple unstable flanks"
      buffer_km: 15
    acquire:
      gunw_dir: "data/nisar/meager/gunw"
      goff_dir: "data/nisar/meager/goff"
    cascade:
      min_volume_m3: 500000    # large-scale failures expected
      exposure:
        max_runout_km: 20
        angle_of_reach_deg: 8  # long-runout volcanic debris flows

  # ===================================================================
  # New Zealand
  # ===================================================================

  - site:
      name: "Aoraki / Mt Cook, Southern Alps, NZ"
      event_date: "1991-12-14"
      description: >
        Highest peak in New Zealand. The 1991 rock-ice avalanche removed
        ~14 million m3 from the summit ridge. Tasman Glacier terminus
        is calving into a rapidly growing proglacial lake (Tasman Lake).
      latitude: -43.59
      longitude: 170.14
      elevation_m: 3724
      hazard_type: "rock-ice avalanche / proglacial lake"
      priority: "MODERATE"
      notes: "1991 summit collapse; Tasman Lake expanding; calving-wave hazard"
      buffer_km: 15
    acquire:
      gunw_dir: "data/nisar/aoraki/gunw"
      goff_dir: "data/nisar/aoraki/goff"

  # ===================================================================
  # South America
  # ===================================================================

  - site:
      name: "Huascaran, Cordillera Blanca, Peru"
      event_date: "1970-05-31"
      description: >
        West face of Huascaran (6,768 m), site of the deadliest glacier
        disasters in recorded history. The 1970 earthquake-triggered
        ice-rock avalanche killed ~6,000 in Yungay.
      latitude: -9.12
      longitude: -77.60
      elevation_m: 6768
      hazard_type: "rock-ice avalanche"
      priority: "CRITICAL"
      notes: "Deadliest glacier disaster in history; steep hanging glaciers remain"
      buffer_km: 20
    acquire:
      gunw_dir: "data/nisar/huascaran/gunw"
      goff_dir: "data/nisar/huascaran/goff"
    cascade:
      min_volume_m3: 500000
      exposure:
        max_runout_km: 30
        angle_of_reach_deg: 9  # documented long-runout history

  - site:
      name: "Palcaraju / Lake Palcacocha, Peru"
      event_date: null
      description: >
        Moraine-dammed glacial lake in the Cordillera Blanca above
        Huaraz (population ~120,000). Lake volume has grown dramatically
        since the 1940s. A 1941 GLOF from Palcacocha killed ~1,800.
      latitude: -9.40
      longitude: -77.38
      elevation_m: 4562
      hazard_type: "GLOF"
      priority: "CRITICAL"
      notes: "1941 GLOF precedent; Huaraz city of 120,000 downstream"
      buffer_km: 15
    acquire:
      gunw_dir: "data/nisar/palcacocha/gunw"
      goff_dir: "data/nisar/palcacocha/goff"
