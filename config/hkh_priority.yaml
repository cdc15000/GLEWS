  - site:
      name: "Thorthormi Glacier Lake, Bhutan"
      event_date: null
      description: >
        Large and rapidly growing glacial lake in the Lunana region,
        northern Bhutan. Thorthormi is merging with the adjacent
        Raphstreng Tsho, increasing total lake volume. A GLOF from
        Raphstreng in 1994 killed 21 people. Combined lake GLOF would
        threaten the Punakha-Wangdue valley (>100,000 people).
      latitude: 28.10
      longitude: 90.25
      elevation_m: 4430
      hazard_type: "GLOF"
      priority: "CRITICAL"
      notes: "Merging with Raphstreng; 1994 GLOF precedent; Punakha valley exposure"
    acquire:
      gunw_dir: "data/nisar/hkh/thorthormi/gunw"
      goff_dir: "data/nisar/hkh/thorthormi/goff"

