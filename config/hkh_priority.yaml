    acquire:
      gunw_dir: "data/nisar/hkh/medvezhiy/gunw"
      goff_dir: "data/nisar/hkh/medvezhiy/goff"

  - site:
      name: "Fedchenko Glacier, Pamir, Tajikistan"
      event_date: null
