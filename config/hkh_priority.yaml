      longitude: 79.98
      elevation_m: 3300
      hazard_type: "jokulhlaup / ice-dam GLOF"
      priority: "HIGH"
      notes: "Annual Merzbacher Lake outbursts; flood volumes >200 Mm3"
    acquire:
      gunw_dir: "data/nisar/hkh/inylchek/gunw"
      goff_dir: "data/nisar/hkh/inylchek/goff"

  - site:
      name: "Ak-Say Glacier, Ala Archa, Kyrgyzstan"
      event_date: null
      description: >
        Glacier above the Ala Archa National Park near Bishkek. Ice
        and rock avalanches from the steep glacier front threaten
        the popular recreational area. Debris flows from glacier
        melt have increased in frequency.
      latitude: 42.53
      longitude: 74.50
      elevation_m: 3800
      hazard_type: "ice avalanche / debris flow"
      priority: "MODERATE"
      notes: "Near Bishkek; popular recreation area; increasing debris flow frequency"
    acquire:
      gunw_dir: "data/nisar/hkh/aksay/gunw"
      goff_dir: "data/nisar/hkh/aksay/goff"

  - site:
      name: "Abramov Glacier, Pamir-Alay, Kyrgyzstan"
      event_date: null
      description: >
        One of the best-studied glaciers in Central Asia with a mass
        balance record since 1967. Located in the Pamir-Alay range.
        Accelerating retreat is creating new proglacial lakes.
        Benchmark site for climate-driven glacier change.
      latitude: 39.64
      longitude: 71.57
      elevation_m: 3870
      hazard_type: "proglacial lake formation"
      priority: "MODERATE"
      notes: "Benchmark glacier; mass balance record since 1967; proglacial lake emerging"
    acquire:
      gunw_dir: "data/nisar/hkh/abramov/gunw"
      goff_dir: "data/nisar/hkh/abramov/goff"
