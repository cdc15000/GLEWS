      priority: "HIGH"
      notes: "2012 GLOF precedent; Kumtor mine infrastructure downstream"
    acquire:
      gunw_dir: "data/nisar/hkh/petrov/gunw"
      goff_dir: "data/nisar/hkh/petrov/goff"

  - site:
      name: "Inylchek Glacier, Central Tien Shan, Kyrgyzstan"
      event_date: null
      description: >
        One of the largest Tien Shan glaciers (~60 km). The South
        Inylchek Glacier dams Lake Merzbacher, which produces annual
        jokulhlaup-type outburst floods (typically late summer) into
        the Inylchek River. Flood volumes can exceed 200 million m3.
