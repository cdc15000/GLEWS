      name: "Medvezhiy Glacier, Pamir, Tajikistan"
      event_date: null
      description: >
        Well-known surge-type glacier in the Vanch Range, western Pamir.
        Surged repeatedly (1963, 1973, 1989, 2011), blocking the Abdukagor
