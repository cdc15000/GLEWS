        Longest glacier outside the polar regions (~77 km). Accelerating
        thinning since the 1980s. Proglacial and supraglacial lake
        development at the terminus. The glacier feeds the Muksu River
        system with downstream GLOF exposure.
      latitude: 38.83
      longitude: 72.20
      elevation_m: 4169
      hazard_type: "proglacial lake / moraine instability"
      priority: "MODERATE"
      notes: "Longest non-polar glacier; accelerating thinning; benchmark site"
    acquire:
      gunw_dir: "data/nisar/hkh/fedchenko/gunw"
      goff_dir: "data/nisar/hkh/fedchenko/goff"

