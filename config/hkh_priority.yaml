        minimal monitoring capacity.
      latitude: 36.90
      longitude: 71.80
      elevation_m: 4500
      hazard_type: "GLOF"
      priority: "MODERATE"
      notes: "Remote; minimal ground-based monitoring; satellite-only feasible"
    acquire:
      gunw_dir: "data/nisar/hkh/wakhan/gunw"
      goff_dir: "data/nisar/hkh/wakhan/goff"

