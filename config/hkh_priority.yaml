      description: >
        Massive landslide-dammed lake formed by the 1911 Usoi earthquake
        (M7.4). The Usoi Dam (~567 m high, world's tallest natural dam)
        impounds ~17 km3 of water. Dam breach would produce a mega-flood
        affecting millions downstream along the Bartang, Panj, and
        Amu Darya rivers. Monitored with World Bank support since 2000.
      latitude: 38.27
      longitude: 72.67
      elevation_m: 3263
      hazard_type: "landslide-dam breach"
      priority: "CRITICAL"
      notes: "17 km3 impounded; dam breach would affect Tajikistan, Afghanistan, Uzbekistan"
    acquire:
      gunw_dir: "data/nisar/hkh/sarez/gunw"
      goff_dir: "data/nisar/hkh/sarez/goff"

  - site:
      name: "Rivakkul Glacier, Pamir, Tajikistan"
      event_date: null
      description: >
        Surge-type glacier in the eastern Pamir that has produced
        ice-dammed lakes during past surges. Limited modern monitoring.
        Downstream communities in the Murghab district.
      latitude: 38.95
      longitude: 73.50
      elevation_m: 4200
      hazard_type: "surge / ice-dam GLOF"
      priority: "MODERATE"
      notes: "Eastern Pamir; limited monitoring; Murghab district exposure"
    acquire:
      gunw_dir: "data/nisar/hkh/rivakkul/gunw"
      goff_dir: "data/nisar/hkh/rivakkul/goff"

