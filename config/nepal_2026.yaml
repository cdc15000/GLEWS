# GLEWS Site Configuration — Gyirong–Rasuwa disaster, 26 August 2026
# Rock–ice avalanche from the north face of Langtang Lirung, Rasuwa, Nepal
#
# This configuration defines the study area, data acquisition parameters,
# processing settings, and anomaly detection thresholds for the PoC
# retrospective analysis.
#
# Event facts from ICIMOD (2026), "Understanding the Gyirong–Rasuwa disaster
# of 26 August 2026: A preliminary synthesis", doi:10.53055/ICIMOD.1150

site:
  name: "Gyirong–Rasuwa 2026"
  event_date: "2026-08-26"
  description: >
    At 08:37 NPT on 26 August 2026 ~132 Mm³ of rock (~115 Mm³) and glacier
    ice (~17 Mm³) detached from the north face of Langtang Lirung at
    ~5,200 masl and fell ~1,200 m into the Lhende Khola. The resulting
    debris surge reached the Gyirong–Rasuwagadhi border corridor in ~7 min
    and continued down the Bhotekoshi–Trishuli. Not a GLOF; no heavy
    rainfall preceded it. Nepal: 1,451 dead, 5,745 missing (NDRRMA,
    21 Sep 2026); China: 43 dead, 519 missing. Sentinel-1 InSAR showed up
    to 40 cm LOS displacement over the source between 7 Jul and 24 Aug 2026;
    NISAR showed up to ~30 cm between 26 Jul and 19 Aug.

  # Failed rock slope core, read from the lat/lon axes of ICIMOD (2026)
  # Figure 9 (Sentinel-1 LOS displacement, 7 Jul-24 Aug). Failed rock
  # slope spans ~28.284-28.293N, 85.519-85.530E; failed glacier extends
  # north to ~28.296N. ~3.6 km N of the Langtang Lirung summit.
  latitude: 28.288
  longitude: 85.524
  # Known failure source, drawn on the dashboard map. Outline of the failed
  # glacier + failed rock slope, digitised approximately by eye from ICIMOD
  # (2026) Figure 9 — good to ~50 m. [lat, lon] vertices.
  known_source:
    label: "Failed slope (ICIMOD 2026, Fig. 9)"
    polygon:
      - [28.2840, 85.5195]
      - [28.2843, 85.5215]
      - [28.2820, 85.5236]
      - [28.2830, 85.5248]
      - [28.2852, 85.5270]
      - [28.2882, 85.5300]
      - [28.2915, 85.5320]
      - [28.2937, 85.5308]
      - [28.2956, 85.5285]
      - [28.2960, 85.5258]
      - [28.2948, 85.5233]
      - [28.2930, 85.5210]
      - [28.2912, 85.5207]
      - [28.2895, 85.5218]
      - [28.2878, 85.5207]
      - [28.2858, 85.5199]
  # Wang et al. (2026, Landslides 23:3489, doi:10.1007/s10346-026-02842-6)
  # Fig. 1b "measurement area": the outlet hanging glacier on the NE edge of
  # the failed slope, where they report 7.4 m/yr (2018-2025) rising to
  # 55 m/yr from January 2026. Georeferenced by matching their panel to our
  # own 12 Aug 2026 Sentinel-2 image (NCC 0.75, 2.105 m per
  # figure pixel; scripts/nepal_2026/register_wang_fig1b.py). ~0.067 km2.
  reference_areas:
    - label: "Wang et al. 2026 measurement area (Fig. 1b)"
      polygon:
        - [28.29255, 85.52951]
        - [28.29194, 85.52968]
        - [28.29131, 85.52979]
        - [28.29066, 85.52992]
        - [28.28998, 85.53003]
        - [28.28931, 85.53013]
        - [28.28864, 85.53024]
        - [28.28796, 85.53032]
        - [28.28731, 85.53038]
        - [28.28730, 85.53009]
        - [28.28770, 85.52969]
        - [28.28812, 85.52931]
        - [28.28852, 85.52890]
        - [28.28894, 85.52852]
        - [28.28935, 85.52811]
        - [28.28985, 85.52812]
        - [28.29038, 85.52838]
        - [28.29090, 85.52864]
        - [28.29137, 85.52888]
        - [28.29189, 85.52914]
        - [28.29243, 85.52939]
    # Wang et al. (2026) Fig. 2a boxes, placed using the measurement area above
    # as anchor and the 2 km scale bar (5.602 m/px; the triangle's size gives
    # 5.71); scripts/nepal_2026/register_wang_fig2a.py.
    - label: "Wang et al. 2026 main glacier box (Fig. 2a; 42.2 m/yr steady)"
      polygon:
        - [28.29027, 85.53346]
        - [28.28822, 85.53715]
        - [28.28631, 85.53580]
        - [28.28835, 85.53211]
    - label: "Wang et al. 2026 stable area box (Fig. 2a)"
      polygon:
        - [28.30229, 85.50909]
        - [28.30236, 85.51291]
        - [28.30046, 85.51296]
        - [28.30039, 85.50913]
  # Months when snow decorrelates high-elevation InSAR here (coherence over
  # the source fell to 0.1-0.2 in Mar-May 2026 NISAR pairs). Shaded on the
  # dashboard time-series and peak-date histogram.
  snow_months: [12, 1, 2, 3, 4, 5]
  # 20 km reaches Rasuwagadhi (~13 km W) so exposure covers the struck corridor
  buffer_km: 20

acquire:
  platform: SENTINEL-1
  beam_mode: IW
  processing_level: SLC
  polarization: VV  # VV typically better for rock/ice deformation

  # Temporal range for time-series analysis
  # Wider window = better seasonal baseline; narrower = faster processing
  start_date: "2025-01-01"
  end_date: "2026-08-26"

  # Orbit selection — prefer a single ascending or descending track
  # for consistent viewing geometry. Set to null to auto-select
  # the track with most scenes.
  path_number: null
  max_scenes: 100

  # Download settings
  output_dir: "data/slc"
  n_workers: 4

process:
  # DEM for topographic phase removal and geometric correction
  dem_source: "SRTM-1"  # 30m SRTM; alternatives: "COP-30", "ASTER-GDEM"

  # Co-registration parameters
  coregistration:
    method: "geometry"  # geometry-based (ISCE-2) or intensity-based
    number_of_bursts: null  # null = all bursts in frame

  # Interferogram network
  network:
    method: "sequential"  # sequential, small_baseline, delaunay
    max_temporal_baseline_days: 48  # ~4 revisit cycles
    max_perpendicular_baseline_m: 200

  # Phase unwrapping
  unwrapping:
    method: "snaphu"
    init_method: "MCF"  # minimum cost flow
    coherence_threshold: 0.4

  # MintPy time-series settings
  mintpy:
    reference_point: "auto"  # or [lat, lon] of a known stable area
    tropospheric_correction: "ERA5"  # ERA5 weather model; alt: "GACOS", "height_correlation"
    min_temporal_coherence: 0.7
    output_dir: "data/mintpy"

detect:
  # Anomaly detection parameters
  # These control the Tier 0 screening sensitivity

  # Time-series decomposition
  seasonal_model: "harmonic"  # fit annual + semi-annual harmonics
  n_harmonics: 2

  # Acceleration detection
  acceleration:
    # Sliding window for acceleration estimation
    window_size_days: 60
    step_days: 12

    # Change-point detection (PELT algorithm)
    changepoint:
      model: "rbf"  # radial basis function kernel
      penalty: "bic"  # Bayesian Information Criterion for model selection
      min_segment_size: 3  # minimum number of observations per segment

    # Anomaly threshold — number of standard deviations above
    # the site's own historical baseline
    sigma_threshold: 2.5

  # Bayesian Online Changepoint Detection (BOCPD) — Adams & MacKay 2007.
  # Detects regime changes in deformation rate per pixel, complementing
  # the acceleration z-score and step-change detectors. Opt-in: set
  # method to "bocpd" to enable. The acceleration.changepoint block
  # above is the older PELT placeholder (not yet implemented).
  # changepoint:
  #   method: "bocpd"
  #   hazard_rate: 0.01          # 1/expected_run_length — prior P(changepoint)
  #   threshold: 0.25            # minimum P(r=0) to flag a changepoint
  #   prior_variance: null       # null = auto-estimate from data (MAD-based)
  #   min_displacement_range_m: 0.01  # skip near-static pixels (cost guard)

  # Step-change detection — catches abrupt, single-epoch displacement
  # jumps that the acceleration detector's trend model misses, since
  # velocity decelerates after a rupture instead of climbing smoothly
  # like Voight's law assumes. The 2026 precursor was gradual (~8 mm/day
  # LOS, ~10 cm per 12-day pair), well below min_displacement_m.
  step_change:
    # Number of baseline standard deviations an inter-epoch jump
    # must exceed to be flagged
    sigma_threshold: 5.0
    # Absolute minimum jump size (meters) required to flag, regardless
    # of sigma — guards against flagging noise at very stable pixels
    min_displacement_m: 0.5

  # Spatial clustering — reject isolated anomalous pixels
  clustering:
    min_cluster_pixels: 5
    max_distance_m: 200  # DBSCAN epsilon
    min_area_m2: 10000  # ~100m × 100m minimum deforming area

  # Voight's law fitting (inverse velocity trend)
  voight:
    enabled: true
    min_points: 5  # minimum observations for fit
    r_squared_threshold: 0.7  # goodness of fit to declare trend

  # Tier 1 multi-sensor cross-check filters — quality-based filtering
  # to eliminate false positives from atmospheric noise, snow cover
  # changes, or processing artifacts. Applied after Tier 0 detection
  # and before cascade risk assessment.
  # tier1_filters:
  #   min_coherence: 0.3              # minimum interferometric coherence
  #   min_spatial_consistency: 0.5    # fraction of pixels in largest connected component
  #   min_temporal_consistency: 0.3   # fraction of epochs with active signal
  #   remove_below_quality: 0.2      # composite score below this -> remove flag
  #   demote_below_quality: 0.5      # composite score below this -> halve score

cascade:
  # Tier 1 — cascade risk filters
  # These are geometric/physical checks, not ML

  # Minimum potentially unstable volume to flag
  min_volume_m3: 100000  # 100,000 m³ for PoC; 500,000 in operational

  # Downstream exposure check
  exposure:
    max_runout_km: 50  # maximum modeled runout distance
    angle_of_reach_deg: 11  # Scheidegger empirical threshold (tan α = H/L)
    population_source: "worldpop"  # or "landscan"

  # River valley confinement
  valley_width_threshold_m: 500  # narrow valleys increase dam risk

report:
  output_dir: "output"
  formats: ["html", "geojson"]
  # Generate figures for each flagged site
  include_time_series_plots: true
  include_spatial_maps: true
  include_cascade_scenarios: true
