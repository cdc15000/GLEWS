# GLEWS curated webcam registry
#
# Webcams shown on the dashboard's Webcams panel alongside Windy's
# listings. Each entry is a public camera stream; GLEWS shows a thumbnail
# and links to the stream — it does not re-host or embed the video.
#
# Coordinates are approximate (village / lodge level, ±1 km) unless
# `coord_precision` says otherwise. `faces` is taken from the stream title
# and has NOT been verified against the view; check by eye before relying
# on a camera for a specific slope or lake.
#
# YouTube live-stream video IDs change when a stream is restarted. Update
# them from the provider's site, or set GLEWS_YOUTUBE_API_KEY so the
# dashboard can report whether each stream is currently live.
#
# Source: https://webcamnepal.com (camera list, 18 Oct 2026). Streams are
# © WebCam Nepal; contact info@webcamnepal.com about reuse or partnership.

providers:
  webcamnepal:
    name: "WebCam Nepal"
    url: "https://webcamnepal.com"
    channel: "https://www.youtube.com/@WEBCAMNEPAL"

