apiVersion: batch/v1
kind: CronJob
metadata:
  name: glews-monitor
  namespace: glews
  labels:
    app.kubernetes.io/name: glews
    app.kubernetes.io/component: monitor
spec:
  schedule: "0 */6 * * *"   # every 6 hours
  concurrencyPolicy: Forbid  # skip if a previous run is still active
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 18000   # 5-hour hard timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: glews
            app.kubernetes.io/component: monitor
        spec:
          restartPolicy: OnFailure
          containers:
            - name: monitor
              image: ghcr.io/glews-project/glews:latest  # replace with your registry
              command: ["glews", "monitor"]
              args:
                - "-c"
                - "$(GLEWS_CONFIG)"
                - "--check-now"
              envFrom:
                - configMapRef:
                    name: glews-config
                - secretRef:
                    name: glews-secrets
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "2"
                  memory: 4Gi
              volumeMounts:
                - name: glews-data
                  mountPath: /app/data
                - name: glews-output
                  mountPath: /app/output
                - name: glews-config-vol
                  mountPath: /app/config
                  readOnly: true
          volumes:
            - name: glews-data
              persistentVolumeClaim:
                claimName: glews-data
            - name: glews-output
              persistentVolumeClaim:
                claimName: glews-output
            - name: glews-config-vol
              configMap:
                name: glews-site-config
