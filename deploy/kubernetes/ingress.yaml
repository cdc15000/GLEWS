apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glews-dashboard
  namespace: glews
  labels:
    app.kubernetes.io/name: glews
    app.kubernetes.io/component: dashboard
  annotations:
    # --- TLS placeholder: uncomment and configure for your cert manager ---
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
spec:
  ingressClassName: nginx
  # --- TLS placeholder ---
  # tls:
  #   - hosts:
  #       - glews.example.com
  #     secretName: glews-tls
  rules:
    - host: glews.example.com     # replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: glews-dashboard
                port:
                  name: http
