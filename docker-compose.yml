version: "3.8"

services:
  monitor:
    build: .
    command:
      - monitor
      - -c
      - ${GLEWS_CONFIG:-config/global_watch.yaml}
      - --interval
      - "${GLEWS_INTERVAL:-6}"
    volumes:
      - ./config:/app/config:ro
      - glews-data:/app/data
      - glews-output:/app/output
      - ${HOME}/.netrc:/root/.netrc:ro
    environment:
      - GLEWS_SMTP_HOST=${GLEWS_SMTP_HOST:-}
      - GLEWS_SMTP_PORT=${GLEWS_SMTP_PORT:-587}
      - GLEWS_SMTP_USER=${GLEWS_SMTP_USER:-}
      - GLEWS_SMTP_PASS=${GLEWS_SMTP_PASS:-}
      - GLEWS_SMTP_TO=${GLEWS_SMTP_TO:-}
      - GLEWS_SLACK_WEBHOOK=${GLEWS_SLACK_WEBHOOK:-}
      - GLEWS_WEBHOOK_URL=${GLEWS_WEBHOOK_URL:-}
    restart: on-failure
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  dashboard:
    build: .
    command:
      - dashboard
      - -c
      - ${GLEWS_CONFIG:-config/global_watch.yaml}
      - --port
      - "${GLEWS_DASHBOARD_PORT:-8080}"
      - --data-dir
      - /app/output
    ports:
      - "${GLEWS_DASHBOARD_PORT:-8080}:${GLEWS_DASHBOARD_PORT:-8080}"
    volumes:
      - ./config:/app/config:ro
      - glews-output:/app/output:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${GLEWS_DASHBOARD_PORT:-8080}/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    depends_on:
      - monitor
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  glews-data:
  glews-output:
