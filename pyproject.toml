[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "glews"
version = "0.1.0"
description = "Glacier and Landslide Early Warning System — PoC InSAR pipeline for satellite detection of unstable glaciers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "GLEWS Project"}]

dependencies = [
    "asf_search>=7.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "click>=8.1",
    "rasterio>=1.3",
    "shapely>=2.0",
    "h5py>=3.8",
    "tqdm>=4.65",
    "ruptures>=1.1",       # change-point detection (PELT, Binseg, etc.)
]

[project.optional-dependencies]
processing = [
    "mintpy>=1.5",         # InSAR time-series (depends on ISCE-2 for processing)
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
glews = "glews.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
